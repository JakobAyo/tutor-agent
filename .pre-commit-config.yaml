# Local checks before each commit; CI runs the same tools, so passing here means passing there.
# Setup once:  uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Recorded data (spike results, test fixtures) must stay byte-exact, so the
      # fixers skip it. The privacy checks below deliberately do NOT skip it.
      - id: trailing-whitespace
        exclude: ^(spike/|tests/fixtures/)
      - id: end-of-file-fixer
        exclude: ^(spike/|tests/fixtures/)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, docs, deps, test, build, ci, style, chore, revert]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # scans staged changes for secrets

  # Ruff and mypy run from the project venv, so they use the versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict, src)
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        files: ^src/
      - id: private-data
        name: private data (home paths, project slugs, emails, .private-terms)
        entry: uv run --no-project python scripts/check_private_data.py
        language: system
        types: [text]
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
