[project]
name = "tutor-agent"
version = "0.1.0"
description = "A personal tutor that watches Claude Code sessions and teaches the concepts behind them."
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
tutor = "tutor_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: calls the real `claude` binary and spends subscription usage (run with `-m real`)",
    "prompt: detection-quality checks on the M0 fixtures with the real model (run with `-m prompt`)",
]
addopts = "-m 'not real and not prompt'"
