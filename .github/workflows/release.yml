# CD for main. On every push to main:
#  1. CI runs again.
#  2. release-please opens (or updates) a "release PR" that bumps the version in
#     pyproject.toml and uv.lock and adds the new section to CHANGELOG.md, based on the
#     Conventional Commits since the last release.
#  3. When that release PR is merged, release-please tags vX.Y.Z and creates the GitHub
#     Release; then the package is built, published to PyPI, attached to the Release, and a
#     back-merge PR (main -> develop) is opened so develop gets the version bump + CHANGELOG.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit # passes the optional PRIVATE_TERMS to the private-data check

  release-please:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT/App token lets the release PR trigger CI (PRs opened with the default
          # GITHUB_TOKEN don't start workflows). Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  build:
    name: Build release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.18"
      - name: Version in pyproject matches the tag
        env:
          EXPECTED: ${{ needs.release-please.outputs.version }}
        run: |
          actual="$(uv version --short --frozen)"
          if [[ "$actual" != "$EXPECTED" ]]; then
            echo "::error::pyproject.toml says $actual but the release is $EXPECTED"; exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tutor-agent/${{ needs.release-please.outputs.version }}/
    permissions:
      id-token: write # trusted publishing (OIDC), no API token stored in the repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  attach-assets:
    name: Attach dist to GitHub Release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  back-merge:
    name: Back-merge main into develop
    needs: [release-please, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head main --state open --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            echo "Back-merge PR #$existing already open."; exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: back-merge ${TAG} into develop" \
            --body "Brings the version bump and CHANGELOG from release ${TAG} back into develop. **Merge with a merge commit, not squash.**"
