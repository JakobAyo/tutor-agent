# Quality gates. Runs on every PR into develop or main, and is reused (workflow_call)
# by develop.yml and release.yml so nothing ships without passing it.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.18"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: ruff check
        run: uv run --frozen ruff check --output-format=github
      - name: ruff format
        run: uv run --frozen ruff format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: mypy (strict, src)
        run: uv run --frozen mypy
      - name: mypy (tests)
        run: >-
          uv run --frozen mypy tests
          --allow-untyped-defs --allow-incomplete-defs --allow-untyped-calls --check-untyped-defs

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: pytest (offline, with coverage floor)
        run: uv run --frozen pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: always() && matrix.python == '3.12'
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python }})"
            echo '```'
            uv run --frozen coverage report --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build sdist and wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean env and run the CLI
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/tutor --help

  secrets:
    name: Secrets & private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just the tip
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (all commits)
        run: gitleaks git --redact --no-banner --verbose .
      - name: gitleaks (working tree)
        run: gitleaks dir --redact --no-banner --verbose .
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Private data (home paths, project slugs, emails, private terms)
        env:
          # Optional repo secret: newline- or comma-separated terms (names, employer, ...).
          # Unavailable on fork PRs, so the generic checks still run there.
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: uv run --no-project python scripts/check_private_data.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  # The single check to mark as "required" in branch rules, so adding or renaming
  # jobs above never needs a settings change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, typecheck, test, build, secrets, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded (or were skipped on purpose)
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
